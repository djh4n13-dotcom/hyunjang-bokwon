<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>현장 복원</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body { background: #0d0d0d; color: #eee; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }

header { width: 100%; padding: 14px 40px; background: #111; border-bottom: 2px solid #e94560; display: flex; justify-content: space-between; align-items: center; }
header h1 { font-size: 1.2rem; color: #e94560; letter-spacing: 3px; }

#submit-btn { padding: 8px 22px; background: #e94560; border: none; border-radius: 4px; color: #fff; font-size: 0.9rem; font-weight: bold; cursor: pointer; font-family: inherit; letter-spacing: 1px; }
#submit-btn:hover { background: #c73652; }

/* 스테이지 바 */
#stage-bar { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; padding: 12px 20px 0; }
.stage-dot { width: 30px; height: 30px; border-radius: 4px; border: 1px solid #333; background: #111; color: #555; font-size: 0.7rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; font-family: inherit; }
.stage-dot.current { border-color: #e94560; background: #e94560; color: #fff; }
.stage-dot.done    { border-color: #27ae60; color: #27ae60; }
.stage-dot.locked  { opacity: 0.3; cursor: not-allowed; }

/* ── 인트로 화면 (전체화면 씬) ── */
#intro-screen {
  display: none;
  position: fixed; inset: 0;
  z-index: 50;
  cursor: pointer;
}

/* 배경 SVG */
#intro-bg {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
}
#intro-bg svg { width: 100%; height: 100%; display: block; }

/* 흐림 + 어두운 오버레이 */
#intro-overlay {
  position: absolute; inset: 0;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}

/* 사건 번호 + 제목 (화면 중앙) */
#intro-title-box {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -60%);
  text-align: center;
  opacity: 0;
  transition: opacity 0.6s;
}
#intro-title-box.show { opacity: 1; }
#intro-case-num { font-size: 0.85rem; color: #e94560; letter-spacing: 5px; margin-bottom: 10px; }
#intro-title    { font-size: 2rem; font-weight: bold; color: #fff; letter-spacing: 2px; text-shadow: 0 0 20px rgba(0,0,0,0.8); }
#intro-place    { font-size: 0.85rem; color: #aaa; letter-spacing: 2px; margin-top: 8px; }

/* 하단 자막 바 */
#subtitle-bar {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: rgba(0,0,0,0.75);
  border-top: 1px solid #333;
  padding: 20px 60px 24px;
  transform: translateY(100%);
  transition: transform 0.4s ease;
}
#subtitle-bar.show { transform: translateY(0); }

#subtitle-speaker {
  font-size: 0.75rem; color: #e94560;
  letter-spacing: 3px; margin-bottom: 8px;
}
#subtitle-text {
  font-size: 1rem; color: #eee;
  line-height: 1.7; min-height: 2em;
  white-space: pre-line;
}
#subtitle-hint {
  font-size: 0.7rem; color: #555;
  text-align: right; margin-top: 10px;
  letter-spacing: 2px;
}
#subtitle-hint.pulse {
  animation: pulse 1.2s infinite;
}
@keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }

/* ── 게임 화면 ── */
#game-screen { display: none; flex-direction: column; align-items: center; width: 100%; }

main { display: flex; align-items: flex-start; justify-content: center; gap: 40px; padding: 30px 20px; flex: 1; }
.photo-card { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.photo-card > span { font-size: 0.75rem; color: #666; letter-spacing: 2px; }

.photo-frame { width: 480px; height: 360px; border: 1px solid #333; border-radius: 4px; overflow: hidden; background: #000; position: relative; }
.photo-frame svg, .photo-frame img { width: 100%; height: 100%; display: block; }

/* 편집 이미지 레이어 */
#edit-layer {
  position: absolute; inset: 0; width: 100%; height: 100%;
}
#edit-layer svg { width: 140%; height: 140%; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); }

/* 패널 */
#panel { width: 480px; background: #111; border: 1px solid #333; border-top: none; border-radius: 0 0 4px 4px; padding: 14px; display: none; }
#panel.open { display: block; }
.row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.row:last-child { margin-bottom: 0; }
.row label { width: 36px; font-size: 0.75rem; color: #888; flex-shrink: 0; }
.row input[type="range"] { flex: 1; height: 6px; border-radius: 3px; outline: none; cursor: pointer; -webkit-appearance: none; appearance: none; background: #222; }
.row input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #e94560; border: 2px solid #fff; cursor: pointer; }
.row .val { width: 40px; font-size: 0.75rem; color: #f0c040; text-align: right; flex-shrink: 0; }

#pos-row { display: flex; justify-content: center; gap: 8px; }
#pos-row button { width: 56px; height: 48px; background: #1a1a1a; border: 1px solid #e94560; border-radius: 4px; color: #fff; font-size: 1.2rem; cursor: pointer; }
#pos-row button:hover { background: #e94560; }

#side-btns { display: flex; flex-direction: column; gap: 10px; padding-top: 28px; }
.side-btn { width: 50px; height: 50px; border: 1px solid #333; border-radius: 4px; background: #111; color: #888; font-size: 1.2rem; cursor: pointer; transition: all 0.15s; font-family: inherit; }
.side-btn:hover  { border-color: #e94560; color: #fff; }
.side-btn.active { background: #e94560; border-color: #e94560; color: #fff; }

/* ── 결과 모달 ── */
#modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 100; }
#modal-bg.open { display: flex; }
#modal { background: #111; border: 1px solid #e94560; border-radius: 8px; padding: 40px 50px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 16px; max-width: 480px; width: 90%; }
#modal-case    { font-size: 0.75rem; color: #e94560; letter-spacing: 3px; }
#modal-score   { font-size: 3rem; font-weight: bold; color: #f0c040; }
#modal-grade   { font-size: 1.4rem; font-weight: bold; }
#modal-divider { border: none; border-top: 1px solid #333; width: 100%; }
#modal-dialogue { font-size: 0.9rem; color: #ccc; line-height: 1.8; min-height: 50px; white-space: pre-line; }

/* ── 아웃트로 화면 (인트로와 동일 구조) ── */
#outro-screen {
  display: none;
  position: fixed; inset: 0;
  z-index: 50;
  cursor: pointer;
}
#outro-bg { position: absolute; inset: 0; width: 100%; height: 100%; }
#outro-bg svg { width: 100%; height: 100%; display: block; }
#outro-overlay {
  position: absolute; inset: 0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}
/* 결과 등급 표시 (아웃트로 중앙) */
#outro-grade-box {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -60%);
  text-align: center;
  opacity: 0;
  transition: opacity 0.6s;
}
#outro-grade-box.show { opacity: 1; }
#outro-grade-label { font-size: 0.8rem; color: #e94560; letter-spacing: 4px; margin-bottom: 8px; }
#outro-grade-score { font-size: 3rem; font-weight: bold; color: #f0c040; }
#outro-grade-text  { font-size: 1.4rem; font-weight: bold; margin-top: 6px; }

#outro-subtitle-bar {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: rgba(0,0,0,0.75);
  border-top: 1px solid #333;
  padding: 20px 60px 24px;
  transform: translateY(100%);
  transition: transform 0.4s ease;
}
#outro-subtitle-bar.show { transform: translateY(0); }
#outro-subtitle-speaker { font-size: 0.75rem; color: #e94560; letter-spacing: 3px; margin-bottom: 8px; }
#outro-subtitle-text    { font-size: 1rem; color: #eee; line-height: 1.7; min-height: 2em; white-space: pre-line; }
#outro-subtitle-hint    { font-size: 0.7rem; color: #555; text-align: right; margin-top: 10px; letter-spacing: 2px; }
#outro-subtitle-hint.pulse { animation: pulse 1.2s infinite; }
#modal-btns  { display: flex; gap: 10px; margin-top: 4px; }
#modal-btns button { padding: 8px 20px; border: none; border-radius: 4px; font-size: 0.85rem; cursor: pointer; font-family: inherit; letter-spacing: 1px; }
#btn-retry { background: #333; color: #fff; }
#btn-next  { background: #e94560; color: #fff; }
</style>
</head>

<div id="modal-bg">

</div><div class="photo-frame">
        <div id="edit-layer"></div>
      </div>

        </div>

            <button onclick="movePos('down')">↓</button>
            <button onclick="movePos('right')">→</button>

        </div>
        <div id="blur-panel" style="display:none">

    : ['적당해요!', '#c0392b'];

    gradeBox.classList.remove('show');
    setTimeout(() => outroNext(), 400);
  }, 1800);
}

function outroNext() {
  if (outroTyping) {
    clearTimeout(outroTimer);
    outroTyping = false;
    const line = outroLines[outroIdx];
    document.getElementById('outro-subtitle-text').textContent = line.text;
    document.getElementById('outro-subtitle-hint').classList.add('pulse');
    return;
  }

  outroIdx++;

  if (outroIdx >= outroLines.length) {
    // 아웃트로 끝 → 다음 스테이지 or 게임 종료
    document.getElementById('outro-screen').style.display = 'none';
    if (cur < stages.length - 1) {
      showIntro(cur + 1);
    } else {
      showEnding();
    }
    return;
  }

  const line = outroLines[outroIdx];
  const bar = document.getElementById('outro-subtitle-bar');
  bar.classList.add('show');
  document.getElementById('outro-subtitle-speaker').textContent = line.speaker || '';
  document.getElementById('outro-subtitle-hint').classList.remove('pulse');

  const el = document.getElementById('outro-subtitle-text');
  el.textContent = '';
  let ci = 0;
  outroTyping = true;

  function typeChar() {
    if (ci < line.text.length) {
      el.textContent += line.text[ci++];
      outroTimer = setTimeout(typeChar, 28);
    } else {
      outroTyping = false;
      document.getElementById('outro-subtitle-hint').classList.add('pulse');
    }
  }
  typeChar();
}

function rnd(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

let introLines = [];   // 현재 스테이지의 대사 배열

function introNext() {
  // 타이핑 중이면 즉시 완성
  if (typing) {
    clearTimeout(typeTimer);
    typing = false;
    const line = introLines[introIdx];
    document.getElementById('subtitle-text').textContent = line.text;
    document.getElementById('subtitle-hint').classList.add('pulse');
    return;
  }

  introIdx++;

  // 마지막 줄 이후 → 게임 시작
  if (introIdx >= introLines.length) {
    document.getElementById('intro-screen').style.display = 'none';
    startGame();
    return;
  }

  const line = introLines[introIdx];
  const bar  = document.getElementById('subtitle-bar');
  bar.classList.add('show');

  document.getElementById('subtitle-speaker').textContent = line.speaker || '';
  document.getElementById('subtitle-hint').classList.remove('pulse');

  // 타이핑 효과
  const el = document.getElementById('subtitle-text');
  el.textContent = '';
  let charIdx = 0;
  typing = true;

  function typeChar() {
    if (charIdx < line.text.length) {
      el.textContent += line.text[charIdx++];
      typeTimer = setTimeout(typeChar, 28);
    } else {
      typing = false;
      document.getElementById('subtitle-hint').classList.add('pulse');
    }
  }
  typeChar();
}

// ── 게임 시작 ──
function startGame() {
  document.getElementById('intro-screen').style.display = 'none';
  document.getElementById('game-screen').style.display  = 'flex';
  document.getElementById('submit-btn').style.display   = 'inline-block';

  // SVG 삽입
  targetFrame.innerHTML  = scenes[cur];
  editLayer.innerHTML    = scenes[cur];

  goal = {
    brightness: rnd(70, 140), contrast: rnd(70, 140),
    hue: rnd(0, 60), blur: 0, x: 0, y: 0,
  };

  const off = initValues[cur];
  s = {
    brightness: Math.max(0,   Math.min(200, goal.brightness + off.brightness - 100)),
    contrast:   Math.max(0,   Math.min(200, goal.contrast   + off.contrast   - 100)),
    hue:        (goal.hue + off.hue) % 360,
    blur:       off.blur,
    x:          off.x,
    y:          off.y,
  };

  targetFrame.querySelector('svg').style.filter = `brightness(${goal.brightness}%) contrast(${goal.contrast}%) hue-rotate(${goal.hue}deg)`;

  document.getElementById('sl-brightness').value = s.brightness;
  document.getElementById('sl-contrast').value   = s.contrast;
  document.getElementById('sl-hue').value        = s.hue;
  document.getElementById('sl-blur').value       = s.blur;
  document.querySelectorAll('#color-panel .val')[0].textContent = s.brightness;
  document.querySelectorAll('#color-panel .val')[1].textContent = s.contrast;
  document.querySelectorAll('#color-panel .val')[2].textContent = s.hue;
  document.querySelector('#blur-panel .val').textContent = s.blur + 'px';

  closeAllPanels();
  applyFilter();
}

function applyFilter() {
  const svg = editLayer.querySelector('svg');
  if (!svg) return;
  svg.style.filter    = `brightness(${s.brightness}%) contrast(${s.contrast}%) hue-rotate(${s.hue}deg) blur(${s.blur}px)`;
  svg.style.transform = `translate(calc(-50% + ${s.x}px), calc(-50% + ${s.y}px))`;
}

function set(key, input) {
  s[key] = parseFloat(input.value);
  input.closest('.row').querySelector('.val').textContent = key === 'blur' ? s[key] + 'px' : s[key];
  applyFilter();
}

function movePos(dir) {
  if (dir === 'up')    s.y -= 4;
  if (dir === 'down')  s.y += 4;
  if (dir === 'left')  s.x -= 4;
  if (dir === 'right') s.x += 4;
  applyFilter();
}

function calcScore() {
  const diffs = [
    Math.abs(s.brightness - goal.brightness) / 200,
    Math.abs(s.contrast   - goal.contrast)   / 200,
    Math.abs(s.hue        - goal.hue)        / 180,
    Math.abs(s.blur       - goal.blur)       / 40,
    (Math.abs(s.x - goal.x) + Math.abs(s.y - goal.y)) / 260,
  ];
  return Math.max(0, Math.round((1 - diffs.reduce((a,b)=>a+b) / diffs.length) * 100));
}

function submitAnswer() {
  const score = calcScore();
  const dl = dialogue[cur];
  let grade, color, resultText;

  if (score >= 90) {
    grade = '완벽해요!'; color = '#27ae60';
    resultText = dl.result90 || '...';
  } else if (score >= 70) {
    grade = '잘했어요!'; color = '#e67e22';
    resultText = dl.result70 || '...';
  } else {
    grade = '적당해요!'; color = '#c0392b';
    resultText = dl.result50 || '...';
  }

  document.getElementById('modal-case').textContent      = `CASE #${stages[cur].caseNum} — ${stages[cur].title}`;
  document.getElementById('modal-score').textContent     = score + '%';
  document.getElementById('modal-grade').textContent     = grade;
  document.getElementById('modal-grade').style.color     = color;
  document.getElementById('modal-dialogue').textContent  = resultText;

  cleared[cur] = true;
  document.getElementById('btn-next').style.display = cur < stages.length - 1 ? 'inline-block' : 'none';
  document.getElementById('modal-bg').classList.add('open');
  renderDots();
}

function retry()      { closeModal(); startGame(); }
function nextStage()  { closeModal(); showIntro(cur + 1); }
function closeModal() { document.getElementById('modal-bg').classList.remove('open'); }

let openPanel = null, activeBtn = null;

function toggle(panelId, btn) {
  const panel = document.getElementById(panelId);
  if (openPanel === panel) { closeAllPanels(); return; }
  closeAllPanels();
  panel.style.display = 'block';
  document.getElementById('panel').classList.add('open');
  btn.classList.add('active');
  openPanel = panel; activeBtn = btn;
}

function closeAllPanels() {
  ['color-panel','pos-panel','blur-panel'].forEach(id => document.getElementById(id).style.display = 'none');
  document.getElementById('panel').classList.remove('open');
  document.querySelectorAll('.side-btn').forEach(b => b.classList.remove('active'));
  openPanel = activeBtn = null;
}

function renderDots() {
  const bar = document.getElementById('stage-bar');
  bar.innerHTML = '';
  stages.forEach((st, i) => {
    const unlocked = i === 0 || cleared[i - 1];
    const dot = document.createElement('button');
    dot.className = 'stage-dot' + (i===cur?' current':'') + (cleared[i]?' done':'') + (!unlocked?' locked':'');
    dot.textContent = unlocked ? i + 1 : '🔒';
    dot.title = unlocked ? `#${st.caseNum} ${st.title}` : '이전 사건을 먼저 해결하세요';
    dot.onclick = () => { if (unlocked) showIntro(i); };
    bar.appendChild(dot);
  });
}

// 시작
showIntro(0);
</script>
